[project]
name = "learn-python-datasci"
version = "0.1.0"
description = "เรียน Python ปูพื้นฐานสู่การทำความสะอาดข้อมูลด้วย NumPy และ Pandas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.6,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
